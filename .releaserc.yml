# ───────────────────────────────────────────────────────────────────────────
# `breaking: major` is ON for the /v7 cut and MUST be returned to `minor` once
# v7.0.0-beta.1 is published. #547 flipped it for the v5→v6 cut and #558 flipped
# it back; this is the same one-shot manoeuvre for v6→v7.
#
# Why it cannot stay on `major`: a Go module's major lives in the import path,
# so a tag whose major disagrees with the path is unconsumable — `go get` fails
# with "go.mod has non-.../vN module path". Left on `major`, the next `!` commit
# after this cut would compute v8.0.0-beta.1 against a /v7 path and publish a
# tag nobody can resolve.
#
# Why the manual-tag route in the previous version of this comment does not
# work: semantic-release only adopts a tag as `lastRelease` when it carries its
# own channel record. A hand-made tag is invisible for that purpose yet still
# feeds `getNextVersion`'s `highest()` second term, so it recomputes its own
# version and collides with itself — `fatal: tag 'v7.0.0-beta.1' already
# exists`, on every run, permanently. Observed on run 33907401438.
# ───────────────────────────────────────────────────────────────────────────
plugins:
  - ["@semantic-release/commit-analyzer", {
      preset: "conventionalcommits",
      parserOpts: {
        noteKeywords: [
          "BREAKING CHANGE",
          "BREAKING CHANGES"
        ]
      },
      releaseRules: [
        { type: "feat", release: "minor" },
        { type: "perf", release: "minor" },
        { type: "build", release: "minor" },
        { type: "chore", release: "patch" },
        { type: "ci", release: "patch" },
        { type: "test", release: "patch" },
        { type: "fix", release: "patch" },
        { type: "refactor", release: "minor" },
        { type: "docs", release: "patch" },
        { breaking: true, release: "major" }
      ]
    }]

  # Plugin to version the CHANGELOG.md
  - ["@semantic-release/git", {
      assets: ["CHANGELOG.md"],
      message: "chore(release): ${nextRelease.version}\n\nupdated changelog."
    }]

  # Plugin to publish the CHANGELOG.md as an asset in the GitHub release
  - ["@semantic-release/github", {
      assets: [
        { path: "CHANGELOG.md", label: "Changelog" }
      ],
      successComment: false,
      failCommentCondition: false,
      labels: []
    }]
  - "@semantic-release/exec"

branches:
  - name: main
  - name: develop
    prerelease: beta
