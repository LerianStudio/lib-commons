# ───────────────────────────────────────────────────────────────────────────
# `breaking` is anchored to `minor`. A Go module's major lives in the import
# path, so a tag whose major disagrees with the path is unconsumable — `go get`
# fails with "go.mod has non-.../vN module path". Left on `major`, the next
# breaking commit would compute v8.0.0-beta.1 against this /v7 path and publish
# a tag nobody can resolve.
#
# Cutting the NEXT major (v8) is a one-shot manoeuvre, done three times now
# (#547 for v5→v6, #633 for v6→v7): rename the module path, flip this rule to
# `major` in the same PR as a breaking commit that touches a non-ignored path,
# let CI publish vN.0.0-beta.1, then revert this rule immediately. commons/
# release_policy_test.go enforces the reverted state.
#
# What does NOT work, tried on #630..#633: tagging vN.0.0 by hand. semantic-
# release adopts a tag as `lastRelease` only when it carries its own channel
# record, so a hand-made tag stays invisible for that purpose while still
# feeding getNextVersion's highest() second term — it recomputes its own
# version and collides with itself, on every run. Run 33907401438 shows it.
# ───────────────────────────────────────────────────────────────────────────
plugins:
  - ["@semantic-release/commit-analyzer", {
      preset: "conventionalcommits",
      parserOpts: {
        noteKeywords: [
          "BREAKING CHANGE",
          "BREAKING CHANGES"
        ]
      },
      releaseRules: [
        { type: "feat", release: "minor" },
        { type: "perf", release: "minor" },
        { type: "build", release: "minor" },
        { type: "chore", release: "patch" },
        { type: "ci", release: "patch" },
        { type: "test", release: "patch" },
        { type: "fix", release: "patch" },
        { type: "refactor", release: "minor" },
        { type: "docs", release: "patch" },
        { breaking: true, release: "minor" }
      ]
    }]

  # Plugin to version the CHANGELOG.md
  - ["@semantic-release/git", {
      assets: ["CHANGELOG.md"],
      message: "chore(release): ${nextRelease.version}\n\nupdated changelog."
    }]

  # Plugin to publish the CHANGELOG.md as an asset in the GitHub release
  - ["@semantic-release/github", {
      assets: [
        { path: "CHANGELOG.md", label: "Changelog" }
      ],
      successComment: false,
      failCommentCondition: false,
      labels: []
    }]
  - "@semantic-release/exec"

branches:
  - name: main
  - name: develop
    prerelease: beta
